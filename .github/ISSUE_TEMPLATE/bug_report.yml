name: Something isn't working
description: Tell us what went wrong in CityHQ.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Easiest:** in CityHQ, open **Settings**, then **Report a problem**. It fills this in for you and
        takes out license keys, passwords, player IDs and IP addresses first.

        Reports here are public, so never paste your `server.cfg`, a license key, a password or your
        players' details. For a security problem, use the **Security** tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: What you were doing
      description: The steps just before it, so it can be made to happen again.
  - type: input
    id: version
    attributes:
      label: CityHQ version
      description: Shown in Settings, under Updates.
      placeholder: "1.9.2"
  - type: dropdown
    id: setup
    attributes:
      label: Your setup
      options:
        - A server CityHQ built on this PC
        - My own server on this PC
        - A server at a host (RocketNode or another)
        - No server chosen yet (Welcome screen)
  - type: textarea
    id: log
    attributes:
      label: CityHQ's log (optional)
      description: The last lines of logs\control-app.log in your server's folder. Check it for private details first.
      render: text
