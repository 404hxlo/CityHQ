# Checks every change before it can reach a release: the type check, the tests and the build,
# on Windows like the app itself. Runs for every push to main and every pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # Includes the type check (npm run typecheck) before building the screens.
      - run: npm run build
